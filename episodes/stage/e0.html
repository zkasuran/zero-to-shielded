<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zero to Shielded · E0 trailer</title>
<link rel="stylesheet" href="./lib/series.css">
<style>
/* E0 trailer: page-only pieces. Motion is driven by the stage engine (no transitions). */
.e0-shot { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.e0-line {
  font: 800 112px/1 "Inter", sans-serif; letter-spacing: -0.045em; color: var(--cream);
  white-space: nowrap; text-align: center;
}
.e0-line.is-xl { font-size: 136px; letter-spacing: -0.05em; }
.e0-line.is-md { font-size: 100px; }
.e0-gold {
  background: linear-gradient(176deg, #FFF0C2 0%, #FFD05A 30%, #F4B728 60%, #C98A00 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  padding: 0 .05em; margin: 0 -.05em;
}
.e0-kicker { font: 700 30px/1 "Inter", sans-serif; letter-spacing: .26em; text-transform: uppercase; color: var(--gold); white-space: nowrap; }

/* light: a soft band that crosses the frame on every cut, a flash, halos and rings */
.e0-sweep {
  position: absolute; left: 0; top: -260px; width: 620px; height: 1600px; pointer-events: none; z-index: 6;
  mix-blend-mode: screen;
  background: linear-gradient(90deg, rgba(255, 214, 110, 0) 0%, rgba(255, 214, 110, .07) 34%, rgba(255, 238, 196, .26) 50%, rgba(255, 214, 110, .07) 66%, rgba(255, 214, 110, 0) 100%);
}
.e0-halo {
  position: absolute; width: 1100px; height: 1100px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(244, 183, 40, .34) 0%, rgba(244, 183, 40, .12) 30%, rgba(244, 183, 40, .03) 52%, rgba(244, 183, 40, 0) 68%);
}
.e0-flash {
  position: absolute; width: 1500px; height: 1500px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(255, 248, 224, .95) 0%, rgba(255, 222, 130, .5) 14%, rgba(244, 183, 40, .14) 34%, rgba(244, 183, 40, 0) 62%);
}
.e0-ring { position: absolute; width: 220px; height: 220px; border-radius: 50%; pointer-events: none; box-shadow: 0 0 0 5px rgba(244, 183, 40, .9), 0 0 40px rgba(244, 183, 40, .5); }
.e0-ring.is-blue { box-shadow: 0 0 0 5px rgba(122, 162, 255, .9), 0 0 40px rgba(122, 162, 255, .5); }
.e0-cv { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }

/* the series row: five numbered dots, lit gold one by one */
.e0-row { display: flex; align-items: center; }
.e0-dot {
  position: relative; width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; isolation: isolate;
  font: 750 34px/1 "Inter", sans-serif; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
  color: color-mix(in oklab, var(--cream), var(--on-gold) calc(var(--lit, 0) * 100%));
}
.e0-dot::before { content: ""; position: absolute; inset: 0; border-radius: 50%; z-index: -2; background: rgba(10, 13, 24, .7); box-shadow: 0 0 0 2px rgba(245, 241, 230, .26) inset; }
.e0-dot > i {
  position: absolute; inset: 0; border-radius: 50%; z-index: -1; opacity: var(--lit, 0);
  background: radial-gradient(circle at 34% 28%, #FFF2C4 0%, #FFD45E 30%, #F4B728 62%, #C98A00 100%);
  box-shadow: 0 0 0 1.5px rgba(255, 236, 170, .7) inset, 0 0 40px rgba(244, 183, 40, .55);
}
.e0-dot > b { position: absolute; inset: -3px; border-radius: 50%; box-shadow: 0 0 0 3px rgba(244, 183, 40, .95); opacity: 0; }
.e0-link { width: 70px; height: 4px; margin: 0 12px; border-radius: 2px; background: rgba(245, 241, 230, .16); overflow: hidden; }
.e0-link > i { display: block; width: 100%; height: 100%; background: linear-gradient(90deg, #F4B728, #FFD66E); transform-origin: 0 50%; transform: scaleX(var(--fill, 0)); }

/* e0-path: the coin track through the shield */
.e0-track { position: absolute; height: 6px; border-radius: 3px; transform-origin: 0 50%; transform: scaleX(var(--draw, 0)); }
.e0-track.is-blue { background: repeating-linear-gradient(90deg, rgba(122, 162, 255, .75) 0 18px, rgba(122, 162, 255, 0) 18px 34px); }
.e0-track.is-gold { background: linear-gradient(90deg, #F4B728, rgba(244, 183, 40, .15)); box-shadow: 0 0 18px rgba(244, 183, 40, .45); }

/* e0-why: split screen, a readable postcard and a sealed letter */
.e0-half { position: absolute; top: 0; width: 960px; height: 1080px; pointer-events: none; }
.e0-half.is-blue { left: 0; background: radial-gradient(ellipse 72% 58% at 52% 46%, rgba(122, 162, 255, .17) 0%, rgba(122, 162, 255, .05) 45%, rgba(122, 162, 255, 0) 72%); }
.e0-half.is-gold { left: 960px; background: radial-gradient(ellipse 72% 58% at 48% 46%, rgba(244, 183, 40, .17) 0%, rgba(244, 183, 40, .05) 45%, rgba(244, 183, 40, 0) 72%); }
.e0-divider { position: absolute; left: 959px; top: 120px; width: 2px; height: 460px; transform-origin: 50% 0; background: linear-gradient(180deg, rgba(245, 241, 230, 0), rgba(245, 241, 230, .4) 22%, rgba(245, 241, 230, .4) 70%, rgba(245, 241, 230, 0)); }
.e0-side { font: 800 64px/1 "Inter", sans-serif; letter-spacing: -0.035em; white-space: nowrap; }
.e0-side.is-blue { color: var(--blue); }
.e0-side.is-gold { color: var(--gold); }
.e0-side small { display: block; margin-top: 14px; font: 600 30px/1 "Inter", sans-serif; letter-spacing: -0.01em; color: var(--soft); text-align: center; }
.e0-letter {
  position: relative; width: 560px; height: 360px; border-radius: 22px; padding: 40px 44px; display: flex; color: #2A1B00;
  background: linear-gradient(170deg, #FFE08A 0%, #F7C23E 40%, #F4B728 62%, #DB9C0C 100%);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .6) inset, 0 0 0 2px rgba(255, 226, 140, .65) inset, 0 40px 80px -26px rgba(0, 0, 0, .85), 0 0 100px -18px rgba(244, 183, 40, .55);
}
.e0-letter-lines { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding-top: 30px; padding-right: 120px; }
.e0-letter-line { position: relative; isolation: isolate; font: 700 36px/1.1 "Inter", sans-serif; letter-spacing: -0.01em; padding-bottom: 14px; border-bottom: 2px solid rgba(110, 70, 0, .28); white-space: pre; font-variant-numeric: tabular-nums; }
.e0-seal {
  position: absolute; right: 36px; top: 30px; width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; color: #FFE6A0;
  background: radial-gradient(circle at 36% 30%, #B57A06 0%, #8A5C00 55%, #6A4600 100%);
  box-shadow: 0 0 0 5px rgba(255, 220, 130, .35) inset, 0 10px 22px rgba(60, 36, 0, .55);
}
.e0-seal svg { width: 50px; height: 50px; }
.e0-hl { position: absolute; left: -14px; right: -14px; top: -8px; bottom: 4px; border-radius: 10px; z-index: -1; transform-origin: 0 50%; }
.e0-hl.is-blue { background: rgba(122, 162, 255, .34); }
.e0-hl.is-gold { background: rgba(90, 56, 0, .2); }
#stage .zts-post-line { position: relative; isolation: isolate; }
.e0-fig { position: relative; }
.e0-fig svg { display: block; overflow: visible; }

/* e0-end */
.e0-url {
  display: inline-flex; align-items: center; gap: 18px; height: 100px; padding: 0 48px 0 36px; border-radius: 999px; overflow: hidden; isolation: isolate;
  font: 650 46px/1 "Inter", sans-serif; letter-spacing: -0.015em; color: var(--cream); white-space: nowrap;
  background: linear-gradient(180deg, rgba(36, 44, 76, .94), rgba(20, 25, 46, .94));
  box-shadow: 0 0 0 1.5px rgba(244, 183, 40, .4) inset, 0 1px 0 rgba(255, 255, 255, .08) inset, 0 30px 60px -22px rgba(0, 0, 0, .8), 0 0 70px -10px rgba(244, 183, 40, .3);
}
.e0-url svg { width: 42px; height: 42px; flex: none; color: var(--gold); }
.e0-url u { position: absolute; left: 96px; right: 48px; bottom: 20px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--gold), #FFD66E); transform-origin: 0 50%; transform: scaleX(var(--draw, 0)); }
.e0-url em { position: absolute; top: -20px; bottom: -20px; left: 0; width: 160px; z-index: -1; background: linear-gradient(90deg, rgba(255, 230, 160, 0), rgba(255, 230, 160, .2), rgba(255, 230, 160, 0)); transform: skewX(-18deg); }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
// E0 · Zero to Shielded in 5 videos (the trailer). Four segments, one page:
//   e0-hook  a gold shield forms from converging particles, "Your first private Zcash payment starts here."
//   e0-path  rapid cuts, one per step: Create New Wallet tap, a coin arrives, blue turns gold through a shield,
//            a note seals in an envelope. The series row 1..5 lights as each step is named.
//   e0-why   split screen: a readable postcard against a sealed gold letter whose lines turn to glyphs. The Watcher squints.
//   e0-end   Maya and Sam cheer. "Start with episode 1" and the site URL.
// Cuts between segments are whip pans: content leaves left with motion blur, the next segment arrives from the right.
import * as Z from "./lib/series.js";
import { maya, sam, watcher } from "/js/cast.js";

const { ease, rng, clamp, lerp, smooth, place, C } = Z;
const SHIELD = "M16 2.6l10.6 4v7.6c0 6.6-4.4 11.8-10.6 13.9C9.8 26 5.4 20.8 5.4 14.2V6.6z";
const norm = (s) => String(s).toLowerCase().replace(/[^\p{L}\p{N}']/gu, "");

// ------------------------------------------------------------------ helpers

// say(S, parent, text, cue): one span per word, each rises in when the voice says it
function say(S, parent, text, cue, { lead = 0.07, dur = 0.85, from = { opacity: 0, y: 48, blur: 14 }, gold = [], seen = {}, at } = {}) {
  const ws = String(text).split(/\s+/).filter(Boolean);
  return ws.map((w, i) => {
    const s = S.el("span", { class: "zts-word", text: w }, parent);
    if (gold.includes(w)) s.classList.add("e0-gold");
    if (i < ws.length - 1) parent.appendChild(document.createTextNode(" "));
    const k = norm(w);
    seen[k] = (seen[k] ?? -1) + 1;
    const t = at != null ? at + i * 0.08 : S.word(cue, k, seen[k]) - lead;
    S.enter(s, { at: t, dur, ease: "outExpo", from });
    return s;
  });
}

function line(S, parent, { x = 960, y, cls = "" } = {}) {
  const el = S.el("div", { class: `e0-line ${cls}`.trim() }, parent);
  place(el, x, y);
  return el;
}

function shotEl(S) {
  return S.el("div", { class: "e0-shot" });
}

// whip pans: fast eased moves, a short blur on each moving piece (motion blur), fade at the far end
function whipOut(S, els, at, { dist = 1900, dur = 0.34, stagger = 0.025, blur = true } = {}) {
  [].concat(els).forEach((el, i) => {
    const a = at + i * stagger;
    S.tween(el, { at: a, dur, ease: "inCubic", to: { x: -dist } });
    if (blur) S.tween(el, { at: a + dur * 0.15, dur: dur * 0.7, ease: "inQuad", to: { blur: 22 } });
    S.tween(el, { at: a + dur * 0.6, dur: dur * 0.4, ease: "inQuad", to: { opacity: 0 } });
  });
}
function whipIn(S, els, at, { dist = 1900, dur = 0.6, stagger = 0.035 } = {}) {
  [].concat(els).forEach((el, i) => {
    const a = at + i * stagger;
    S.tween(el, { at: a, dur, ease: "outExpo", from: { x: dist }, to: { x: 0 } });
    S.tween(el, { at: a, dur: dur * 0.55, ease: "outCubic", from: { blur: 22 }, to: { blur: 0 } });
    S.tween(el, { at: a, dur: 0.14, ease: "outQuad", from: { opacity: 0 }, to: { opacity: 1 } });
  });
}
// a soft band of light that crosses the frame right to left (screen space, above the camera)
function sweep(S, at, { dur = 0.42 } = {}) {
  const el = S.el("div", { class: "e0-sweep", tf: "skewX(-14deg)" }, S.overlay);
  S.tween(el, { at, dur, ease: "inOutCubic", from: { x: 2200 }, to: { x: -900 } });
  return el;
}

// rig(host): pivots for the animatable cast groups (data-origin is in viewBox units)
function rig(host) {
  const P = {};
  host.querySelectorAll("g[data-origin]").forEach((g) => {
    const [ox, oy] = g.getAttribute("data-origin").split(/[\s,]+/).map(Number);
    g.style.transformBox = "view-box";
    g.style.transformOrigin = `${ox}px ${oy}px`;
    for (const c of g.classList) if (!P[c]) P[c] = g;
  });
  return P;
}
function figure(S, fn, opts, { x, y, parent } = {}) {
  const el = S.el("div", { class: "e0-fig", html: fn({ theme: "dark", ...opts }) }, parent);
  place(el, x, y);
  return { el, P: rig(el) };
}
const setTf = (g, tf) => { if (g && g._tf !== tf) { g.style.transform = tf; g._tf = tf; } };
// a blink every few seconds, pure in t
const blinkAt = (t, seed, period = 2.9) => {
  const ph = ((t + seed * 0.77) % period + period) % period;
  return ph < 0.16 ? 1 - Math.sin((ph / 0.16) * Math.PI) * 0.92 : 1;
};

// the series row: dots 1..5 joined by links; light(i, at) fills it gold
function seriesRow(S, { x = 960, y = 112, parent } = {}) {
  const el = S.el("div", { class: "e0-row" }, parent);
  place(el, x, y);
  const dots = [], links = [];
  for (let i = 0; i < 5; i++) {
    if (i) links.push(S.el("div", { class: "e0-link", html: "<i></i>" }, el).firstChild);
    const d = S.el("div", { class: "e0-dot", html: `<i></i><b></b><span>${i + 1}</span>` }, el);
    S.set(d.children[1], { opacity: 0 });
    dots.push(d);
  }
  const light = (i, at) => {
    const d = dots[i];
    S.tween(d, { at, dur: 0.3, ease: "outCubic", from: { "--lit": 0 }, to: { "--lit": 1 } });
    S.tween(d, { at, dur: 0.18, ease: "outCubic", to: { scale: 1.22 } });
    S.tween(d, { at: at + 0.18, dur: 0.6, ease: "outBack", to: { scale: 1 } });
    S.tween(d.children[1], { at, dur: 0.75, ease: "outCubic", from: { opacity: 0.95, scale: 1 }, to: { opacity: 0, scale: 1.7 } });
    if (i > 0) S.tween(links[i - 1], { at: at - 0.3, dur: 0.32, ease: "inOutCubic", from: { "--fill": 0 }, to: { "--fill": 1 } });
  };
  return { el, dots, links, light };
}

function sprite(rgb, size = 64) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  const grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grd.addColorStop(0, `rgba(${rgb},1)`);
  grd.addColorStop(0.2, `rgba(${rgb},.8)`);
  grd.addColorStop(0.45, `rgba(${rgb},.2)`);
  grd.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = grd;
  g.fillRect(0, 0, size, size);
  return c;
}

// particleShield: gold motes swirl in from everywhere and settle on the shield outline and fill.
// One canvas, seeded, every position a pure function of t.
function particleShield(S, { cx, cy, size, form, seed = 11, count = 260 }) {
  const PRE = 0.38; // the swirl is already moving on the first frame
  const cv = S.el("canvas", { class: "e0-cv" });
  const k = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(1920 * k);
  cv.height = Math.round(1080 * k);
  const ctx = cv.getContext("2d");
  const sc = size / 24;
  const map = (u, v) => [cx + (u - 16) * sc, cy + (v - 15.8) * sc];
  const R = rng(seed);
  const ns = "http://www.w3.org/2000/svg";
  const tmp = document.createElementNS(ns, "svg");
  tmp.setAttribute("width", "0");
  tmp.setAttribute("height", "0");
  const pe = document.createElementNS(ns, "path");
  pe.setAttribute("d", SHIELD);
  tmp.appendChild(pe);
  document.body.appendChild(tmp);
  const len = pe.getTotalLength();
  const parts = [];
  const nEdge = Math.round(count * 0.46);
  for (let i = 0; i < nEdge; i++) {
    const q = pe.getPointAtLength((i / nEdge) * len);
    parts.push({ T: map(q.x, q.y), edge: true });
  }
  tmp.remove();
  const p2d = new Path2D(SHIELD);
  let guard = 0;
  while (parts.length < count && guard++ < 40000) {
    const u = 4 + R() * 24, v = 1.6 + R() * 28.4;
    if (ctx.isPointInPath(p2d, u, v)) parts.push({ T: map(u, v), edge: false });
  }
  for (const p of parts) {
    const a = R() * Math.PI * 2, r = 240 + Math.pow(R(), 0.9) * 980;
    p.D = [Math.cos(a) * r, Math.sin(a) * r * 0.72];
    p.sw = (R() < 0.5 ? -1 : 1) * (0.45 + R() * 0.8);
    p.d = (p.edge ? 0 : 0.1) + R() * 0.22;
    p.dur = Math.min(form + PRE - 0.04 - p.d, 0.95 + R() * 0.3);
    p.r = p.edge ? 2.4 + R() * 2.2 : 1.6 + R() * 2.4;
    p.pale = R() < 0.3;
  }
  const gold = sprite("255,206,96"), pale = sprite("255,240,200");
  const pos = (p, t) => {
    const q = clamp((t + PRE - p.d) / p.dur);
    const e = ease.inOutCubic(q);
    const k1 = 1 - e, ang = p.sw * k1, c = Math.cos(ang), s = Math.sin(ang);
    return [p.T[0] + (p.D[0] * c - p.D[1] * s) * k1, p.T[1] + (p.D[0] * s + p.D[1] * c) * k1, e];
  };
  // the outline glows in as the edge motes arrive
  const outline = new Path2D();
  outline.addPath(p2d, new DOMMatrix().translate(cx - 16 * sc, cy - 15.8 * sc).scale(sc));
  let last = null;
  S.on((t) => {
    const fade = 1 - smooth(form + 0.02, form + 0.5, t);
    const key = fade <= 0 ? "off" : t.toFixed(4);
    if (key === last) return;
    last = key;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.clearRect(0, 0, 1920, 1080);
    if (fade <= 0) return;
    const og = smooth(0.45, form, t) * fade;
    if (og > 0) {
      ctx.globalAlpha = og * 0.3;
      ctx.strokeStyle = "#F4B728";
      ctx.lineWidth = 12;
      ctx.stroke(outline);
      ctx.globalAlpha = og * 0.8;
      ctx.strokeStyle = "#FFE39A";
      ctx.lineWidth = 2.5;
      ctx.stroke(outline);
    }
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";
    for (const p of parts) {
      const [x, y, e] = pos(p, t);
      const a = (0.55 + 0.45 * e) * fade;
      const r = p.r * (1 + 1.5 * (1 - e));
      ctx.globalAlpha = a;
      ctx.drawImage(p.pale ? pale : gold, x - r * 3, y - r * 3, r * 6, r * 6);
      const [px, py] = pos(p, t - 0.04);
      const dd = Math.hypot(x - px, y - py);
      if (dd > 4) {
        ctx.globalAlpha = a * 0.5;
        ctx.strokeStyle = p.pale ? "#FFF3D0" : "#FFD25E";
        ctx.lineWidth = Math.max(1, r * 0.75);
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(x, y);
        ctx.stroke();
      }
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  });
  return cv;
}

// a diagonal glint across a series shield (Z.shield element), clipped to the shield shape
function glint(S, shieldEl, at, { dur = 0.8, id = "g" } = {}) {
  const svg = shieldEl.querySelector("svg");
  const ns = "http://www.w3.org/2000/svg";
  const defs = document.createElementNS(ns, "defs");
  defs.innerHTML = `<clipPath id="e0clip-${id}"><path d="${SHIELD}"/></clipPath><linearGradient id="e0glint-${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>`;
  svg.appendChild(defs);
  const g = document.createElementNS(ns, "g");
  g.setAttribute("clip-path", `url(#e0clip-${id})`);
  const r = document.createElementNS(ns, "rect");
  r.setAttribute("y", "-4");
  r.setAttribute("width", "7");
  r.setAttribute("height", "40");
  r.setAttribute("fill", `url(#e0glint-${id})`);
  r.setAttribute("transform", "skewX(-24)");
  g.appendChild(r);
  svg.appendChild(g);
  S.on((t) => {
    const x = (lerp(-6, 44, ease.inOutCubic(clamp((t - at) / dur)))).toFixed(2);
    if (r._x !== x) { r.setAttribute("x", x); r._x = x; }
  });
}

// ------------------------------------------------------------------ 1. hook
Z.scene("e0-hook", (S) => {
  const W = (w, n = 0) => S.word(0, w, n);
  const SX = 960, SY = 318, SIZE = 236, form = 1.24;

  const halo = S.el("div", { class: "e0-halo" });
  place(halo, SX, SY);
  S.tween(halo, { at: 0, dur: form, ease: "inCubic", from: { opacity: 0.15, scale: 0.55 }, to: { opacity: 0.7, scale: 0.85 } });
  S.tween(halo, { at: form, dur: 1.2, ease: "outExpo", to: { opacity: 1, scale: 1.05 } });

  const sh = Z.shield(S, { size: SIZE, x: SX, y: SY });
  S.tween(sh, { at: form - 0.08, dur: 0.18, ease: "outQuad", from: { opacity: 0 }, to: { opacity: 1 } });
  S.tween(sh, { at: form - 0.08, dur: 0.9, ease: "outBack", from: { scale: 0.84 }, to: { scale: 1 } });
  // a slow float once it has formed
  S.tween(sh, { at: form + 0.9, dur: 2.4, ease: "inOutSine", to: { y: -8 } });
  glint(S, sh, form + 0.45, { dur: 0.85, id: "hook" });
  glint(S, sh, 3.1, { dur: 0.7, id: "hook2" });

  particleShield(S, { cx: SX, cy: SY, size: SIZE, form });

  const flash = S.el("div", { class: "e0-flash" });
  place(flash, SX, SY);

  S.tween(flash, { at: form + 0.06, dur: 0.75, ease: "outCubic", to: { opacity: 0, scale: 1.2 } });

  // the line, word by word as the voice says it

  const l2 = line(S, S.root, { y: 698 });
  say(S, l2, "payment starts here.", 0, { seen });
  // "here." lands with a small push of light under it
  const glow = S.el("div", { class: "e0-halo", style: { width: "900px", height: "300px", opacity: 0 } });
  place(glow, 960, 700);

  // camera: a slow pull back that opens the frame as the line arrives
  S.camera([

  // whip pan out

// ------------------------------------------------------------------ 2. the path, four fast cuts
Z.scene("e0-path", (S) => {
  const W = (w, n = 0) => S.word(0, w, n);
  const tSet = W("Set"), tGet = W("Get"), tShield = W("Shield"), tSend = W("Send");
  const cut1 = tSet - 0.24, cut2 = tGet - 0.22, cut3 = tShield - 0.2, cut4 = tSend - 0.16;
  const tEnd = S.cueEnd(0);
  const finalOut = Math.min(S.seconds - 0.5, tEnd + 0.6);

  // the series row lives in a fixed layer above the shots, so camera and cuts never move it
  const hud = S.layer(0, { above: true });
  const row = seriesRow(S, { parent: hud, x: 960, y: 118 });
  S.tween(row.el, { at: cut1 - 0.42, dur: 0.62, ease: "inOutCubic", from: { y: 470, scale: 1.45 }, to: { y: 0, scale: 1 } });
  row.dots.forEach((d, i) => S.enter(d, { at: 0.04 + i * 0.06, dur: 0.8, ease: "outExpo", from: { opacity: 0, x: 900, blur: 14 } }));
  row.links.forEach((l, i) => S.enter(l.parentNode, { at: 0.08 + i * 0.06, dur: 0.8, ease: "outExpo", from: { opacity: 0, x: 900 } }));
  // "Five": all five ring once
  row.dots.forEach((d, i) => S.tween(d.children[1], { at: W("Five") + 0.05 + i * 0.07, dur: 0.6, ease: "outCubic", from: { opacity: 0.8, scale: 1 }, to: { opacity: 0, scale: 1.5 } }));

  // ---- shot 0: "Five short videos."
  const s0 = shotEl(S);
  const l0 = line(S, s0, { y: 420, cls: "is-xl" });
  say(S, l0, "Five short videos.", 0, { gold: ["Five"] });
  S.tween(s0, { at: 0, dur: cut1, ease: "inOutSine", from: { scale: 1 }, to: { scale: 1.04 } });
  whipOut(S, [l0], cut1 - 0.12);
  sweep(S, 0, { dur: 0.36 });

  // ---- shot 1: Set up Zodl (a Create New Wallet tap)
  const s1 = shotEl(S);
  const l1 = line(S, s1, { y: 300, cls: "is-md" });
  say(S, l1, "Set up Zodl", 0, { seen: {} });
  const tap1 = W("Zodl") + 0.04;
  const flow = Z.stepFlow(S, {
    y: 610, size: "lg", until: null,
    steps: ["Open Zodl", { label: "Create New Wallet", tap: tap1 }],
    times: [cut1 + 0.16, cut1 + 0.5],
  });
  s1.appendChild(flow.el);
  S.set(flow.el, { scale: 1.16 });
  // series tap(): the ring and ripple start from their `from` values, so keep them hidden until the tap
  flow.chips.flat().forEach((c) => { S.set(c._ring, { opacity: 0 }); S.set(c._ripple, { opacity: 0 }); });
  row.light(0, tSet);
  whipIn(S, [l1, flow.el], cut1, { stagger: 0.05 });
  S.tween(s1, { at: cut1, dur: cut2 - cut1, ease: "inOutSine", from: { scale: 1 }, to: { scale: 1.05 } });
  whipOut(S, [l1, flow.el], cut2 - 0.14);
  sweep(S, cut2 - 0.16);

  // ---- shot 2: Get your first ZEC (a coin arrives)
  const s2 = shotEl(S);
  const l2 = line(S, s2, { y: 290, cls: "is-md" });
  say(S, l2, "Get your first ZEC", 0, { seen: {} });
  const ph = Z.phone(S, { x: 960, y: 640, glyph: null, tone: "blue", glow: 0.3, scale: 0.7, parent: s2 });
  const land = W("ZEC") - 0.04;
  const ring2 = S.el("div", { class: "e0-ring is-blue" }, s2);
  place(ring2, 960, 640);
  S.set(ring2, { opacity: 0 });
  S.tween(ring2, { at: land, dur: 0.8, ease: "outCubic", from: { opacity: 0.95, scale: 0.4 }, to: { opacity: 0, scale: 2.1 } });
  const coin2 = Z.coin(S, "blue", { size: 132, x: 960, y: 640, parent: s2 });
  S.tween(coin2, { at: land - 0.6, dur: 0.6, ease: "outCubic", from: { x: 820 }, to: { x: 0 } });
  S.tween(coin2, { at: land - 0.6, dur: 0.6, ease: "inCubic", from: { y: -330 }, to: { y: 0 } });
  S.tween(coin2, { at: land - 0.6, dur: 0.6, ease: "outCubic", from: { rotate: 160, opacity: 0 }, to: { rotate: 0, opacity: 1 } });
  S.tween(coin2, { at: land, dur: 0.08, ease: "outQuad", to: { scaleY: 0.8, scaleX: 1.14 } });
  S.tween(coin2, { at: land + 0.08, dur: 0.6, ease: "outBack", to: { scaleY: 1, scaleX: 1 } });
  S.tween(ph._screen, { at: land, dur: 0.16, ease: "outQuad", from: { "--glow": 0.3 }, to: { "--glow": 1.25 } });
  S.tween(ph._screen, { at: land + 0.16, dur: 0.8, ease: "outCubic", to: { "--glow": 0.95 } });
  const glow2 = S.el("div", { class: "e0-halo", style: { width: "820px", height: "820px", filter: "hue-rotate(180deg) saturate(.8)" } }, s2);
  s2.insertBefore(glow2, s2.firstChild);
  place(glow2, 960, 640);
  S.tween(glow2, { at: land - 0.05, dur: 0.7, ease: "outExpo", from: { opacity: 0, scale: 0.6 }, to: { opacity: 0.9, scale: 1 } });
  row.light(1, tGet);
  whipIn(S, [l2, ph], cut2, { stagger: 0.05 });
  S.tween(s2, { at: cut2, dur: cut3 - cut2, ease: "inOutSine", from: { scale: 1 }, to: { scale: 1.05 } });
  whipOut(S, [l2, ph, coin2], cut3 - 0.14);
  whipOut(S, [glow2], cut3 - 0.14, { blur: false });
  sweep(S, cut3 - 0.16);

  // ---- shot 3: Shield it (blue in, gold out)
  const s3 = shotEl(S);
  const l3 = line(S, s3, { y: 290, cls: "is-md" });
  say(S, l3, "Shield it", 0, { gold: ["Shield"], seen: {} });
  const mid = W("it") - 0.12;
  const trackL = S.el("div", { class: "e0-track is-blue", style: { left: "470px", top: "637px", width: "440px" } }, s3);
  const trackR = S.el("div", { class: "e0-track is-gold", style: { left: "1010px", top: "637px", width: "440px" } }, s3);
  S.tween(trackL, { at: cut3 + 0.05, dur: 0.4, ease: "outCubic", from: { "--draw": 0 }, to: { "--draw": 1 } });
  S.tween(trackR, { at: mid, dur: 0.45, ease: "outExpo", from: { "--draw": 0 }, to: { "--draw": 1 } });
  const halo3 = S.el("div", { class: "e0-halo", style: { width: "760px", height: "760px" } }, s3);
  place(halo3, 960, 640);
  S.tween(halo3, { at: mid - 0.05, dur: 0.6, ease: "outExpo", from: { opacity: 0.25, scale: 0.7 }, to: { opacity: 1, scale: 1.05 } });
  const blue3 = Z.coin(S, "blue", { size: 124, x: 960, y: 640, parent: s3 });
  const gold3 = Z.coin(S, "gold", { size: 124, x: 960, y: 640, parent: s3 });
  const sh3 = Z.shield(S, { size: 214, x: 960, y: 632, parent: s3 });
  S.tween(blue3, { at: cut3 + 0.1, dur: mid - cut3 - 0.1, ease: "inCubic", from: { x: -470 }, to: { x: 0 } });
  S.set(blue3, { opacity: 0 }, mid);
  S.set(gold3, { opacity: 0 }, -1e9);
  S.set(gold3, { opacity: 1 }, mid);
  S.tween(gold3, { at: mid, dur: 0.7, ease: "outExpo", from: { x: 0 }, to: { x: 470 } });
  S.tween(sh3, { at: mid - 0.04, dur: 0.12, ease: "outQuad", to: { scale: 1.14 } });
  S.tween(sh3, { at: mid + 0.08, dur: 0.6, ease: "outBack", to: { scale: 1 } });
  Z.burst(S, { at: mid, x: 960, y: 636, count: 60, power: 0.8, seed: 9, life: 1.1 });
  row.light(2, tShield);
  whipIn(S, [l3, sh3], cut3, { stagger: 0.05 });
  S.enter(blue3, { at: cut3 + 0.04, dur: 0.25, ease: "outQuad", from: { opacity: 0 } });
  S.tween(s3, { at: cut3, dur: cut4 - cut3, ease: "inOutSine", from: { scale: 1 }, to: { scale: 1.05 } });
  whipOut(S, [l3, trackL, trackR, sh3, gold3], cut4 - 0.14, { stagger: 0.015 });
  whipOut(S, [halo3], cut4 - 0.14, { blur: false });
  sweep(S, cut4 - 0.16);

  // ---- shot 4: Send a private note (the note slides in, the flap closes, the seal sets)
  const s4 = shotEl(S);
  const l4 = line(S, s4, { y: 262, cls: "is-md" });
  say(S, l4, "Send a private note", 0, { gold: ["private"], seen: {} });
  const env = Z.envelope(S, { x: 960, y: 706, lines: ["Thanks for lunch!"], parent: s4 });
  env._rows[0].style.fontSize = "40px";
  S.set(env, { scale: 0.86 });
  const flap = env.querySelector(".zts-env-flap");
  const tIn = W("note") - 0.3, tClose = tIn + 0.5, tSeal = tClose + 0.36;
  S.tween(env, { at: tIn, dur: 0.5, ease: "inOutCubic", from: { "--rise": 1 }, to: { "--rise": 0 } });
  S.tween(env, { at: tClose, dur: 0.42, ease: "inOutCubic", from: { "--open": 1 }, to: { "--open": 0 } });
  S.on((t) => {
    const shut = S.valueOf(env, "--open", t) < 0.5;
    if (flap._s !== shut) { flap.style.zIndex = shut ? "3" : "-1"; flap._s = shut; }
  });
  // once sealed the letter is inside: hide it so no corner of it peeks past the flap
  S.tween(env._letter, { at: tClose + 0.3, dur: 0.12, ease: "outQuad", to: { opacity: 0 } });
  S.tween(env._seal, { at: tSeal - 0.1, dur: 0.55, ease: "outBack", from: { scale: 1.9 }, to: { scale: 1 } });
  S.tween(env, { at: tSeal, dur: 0.1, ease: "outQuad", to: { scale: 0.83 } });
  S.tween(env, { at: tSeal + 0.1, dur: 0.5, ease: "outBack", to: { scale: 0.86 } });
  Z.burst(S, { at: tSeal + 0.04, x: 960, y: 706 + 40, count: 56, power: 0.75, seed: 21, life: 1.1 });
  row.light(3, tSend);
  // the fifth episode lights last: the whole series
  row.light(4, Math.min(finalOut - 0.35, tSeal + 0.32));
  whipIn(S, [l4, env], cut4, { stagger: 0.05 });
  S.tween(s4, { at: cut4, dur: finalOut - cut4, ease: "inOutSine", from: { scale: 1 }, to: { scale: 1.05 } });
  // the sealed letter takes off, then everything whips out
  S.tween(env, { at: finalOut - 0.25, dur: 0.25, ease: "inCubic", to: { y: -30, rotate: -5 } });
  whipOut(S, [l4, env, row.el], finalOut, { stagger: 0.04 });
  sweep(S, finalOut + 0.02);
}, {
  label: "Illustration",
  seconds: 8.13,
  narration: ["Five short videos. Set up Zodl. Get your first ZEC. Shield it. Send a private note."],
});

// ------------------------------------------------------------------ 3. why: postcard vs sealed letter
Z.scene("e0-why", (S) => {
  const W = (w, n = 0) => S.word(0, w, n);
  const tHide = W("hides");
  const beats = [W("who", 0), W("who", 1), W("how")];
  const lines = ["From Maya", "To Sam", "0.5 ZEC"];
  const L = 520, R = 1400, CY = 500;

  const tl = S.el("div", { class: "e0-half is-blue" });
  const tr = S.el("div", { class: "e0-half is-gold" });
  S.enter(tl, { at: 0.05, dur: 0.8, ease: "outCubic", from: { opacity: 0 } });
  S.enter(tr, { at: 0.12, dur: 0.8, ease: "outCubic", from: { opacity: 0 } });
  const div = S.el("div", { class: "e0-divider" });
  S.tween(div, { at: 0.2, dur: 0.7, ease: "outExpo", from: { scaleY: 0, opacity: 0 }, to: { scaleY: 1, opacity: 1 } });

  const hL = S.el("div", { class: "e0-side is-blue", html: "Transparent" });
  place(hL, L, 196);
  const hR = S.el("div", { class: "e0-side is-gold", html: "Shielded" });
  place(hR, R, 196);

  const post = Z.postcard(S, { lines, tag: null, x: L, y: CY });
  // the sealed letter: same three lines, they turn to glyphs on "hides" and never come back
  const letter = S.el("div", { class: "e0-letter" });
  place(letter, R, CY);
  const box = S.el("div", { class: "e0-letter-lines" }, letter);
  const lrows = lines.map((ln, i) => {
    const r = S.el("div", { class: "e0-letter-line" }, box);
    const txt = S.el("span", {}, r);
    S.scramble(txt, { text: ln, at: tHide + 0.05 + i * 0.1, until: tHide + 0.55 + i * 0.1, seed: 31 + i, mode: "encrypt", rate: 12 });
    return r;
  });
  const seal = S.el("div", { class: "e0-seal", html: Z.icons.lock }, letter);
  S.tween(seal, { at: tHide - 0.06, dur: 0.6, ease: "outBack", from: { opacity: 0, scale: 2.2, rotate: -20 }, to: { opacity: 1, scale: 1, rotate: 0 } });
  S.tween(letter, { at: tHide + 0.02, dur: 0.1, ease: "outQuad", to: { scale: 0.97 } });
  S.tween(letter, { at: tHide + 0.12, dur: 0.55, ease: "outBack", to: { scale: 1 } });
  Z.burst(S, { at: tHide + 0.04, x: R + 228, y: CY - 128, count: 34, power: 0.45, seed: 5, life: 0.9 });

  // "who paid", "who got paid", "how much": the same row on both cards
  beats.forEach((bt, i) => {
    const hp = S.el("i", { class: "e0-hl is-blue" }, post._rows[i]);
    S.tween(hp, { at: bt - 0.04, dur: 0.38, ease: "outCubic", from: { scaleX: 0, opacity: 1 }, to: { scaleX: 1 } });
    const hg = S.el("i", { class: "e0-hl is-gold" }, lrows[i]);
    S.tween(hg, { at: bt + 0.04, dur: 0.38, ease: "outCubic", from: { scaleX: 0, opacity: 1 }, to: { scaleX: 1 } });
    if (i < 2) {
      S.tween(hp, { at: beats[i + 1] - 0.04, dur: 0.4, to: { opacity: 0.35 } });
      S.tween(hg, { at: beats[i + 1] + 0.04, dur: 0.4, to: { opacity: 0.35 } });
    }
    S.tween(post._rows[i], { at: bt - 0.04, dur: 0.16, ease: "outCubic", to: { x: 8 } });
    S.tween(post._rows[i], { at: bt + 0.12, dur: 0.5, ease: "outBack", to: { x: 0 } });
  });

  // the Watcher between them, leaning toward the letter, squinting at glyphs it cannot read
  const wf = figure(S, watcher, { size: 352, pose: "point", mood: "thinking" }, { x: 962, y: 716 });
  const P = wf.P;
  const lean = (t) => {
    let r = 7 * ease.inOutCubic(clamp((t - (tHide + 0.1)) / 0.6));
    beats.forEach((bt) => { r += 3 * Math.sin(Math.PI * clamp((t - bt - 0.1) / 0.5)); });
    return r;
  };
  S.on((t) => {
    const br = 1 + 0.014 * Math.sin(t * 2.6);
    setTf(P["cast-body"], `scale(1,${br.toFixed(4)})`);
    setTf(P["cast-head"], `rotate(${lean(t).toFixed(3)}deg)`);
    // squint: the glass narrows once the letter scrambles, tighter on every beat
    let sq = 1 - 0.5 * ease.outCubic(clamp((t - (tHide + 0.3)) / 0.3));
    beats.forEach((bt) => { sq -= 0.18 * Math.sin(Math.PI * clamp((t - bt - 0.05) / 0.7)); });
    sq = Math.max(0.12, sq * blinkAt(t, 3));
    setTf(P["cast-eyes"], `scale(1,${sq.toFixed(4)})`);
  });

  S.camera([
    { at: 0, x: 960, y: 500, zoom: 1.0 },
    { at: tHide - 0.35, dur: 1.4, x: 1040, y: 505, zoom: 1.06, ease: "inOutCubic" },
    { at: beats[2] - 0.5, dur: 1.2, x: 1000, y: 505, zoom: 1.08, ease: "inOutCubic" },
  ]);

  whipIn(S, [hL, post, hR, letter, wf.el], 0, { stagger: 0.04 });
  sweep(S, 0, { dur: 0.36 });
  const out = Math.min(S.seconds - 0.42, S.cueEnd(0) + 0.65);
  whipOut(S, [hL, post, wf.el, hR, letter], out, { stagger: 0.02 });
  [div, tl, tr].forEach((el) => S.tween(el, { at: out + 0.05, dur: 0.3, ease: "inQuad", to: { opacity: 0 } }));
  sweep(S, out + 0.02);
}, {
  label: "Illustration",
  seconds: 5.83,
  narration: ["A shielded payment hides who paid, who got paid and how much."],
});

// ------------------------------------------------------------------ 4. end
Z.scene("e0-end", (S) => {
  const W = (w, n = 0) => S.word(0, w, n);
  const tOne = W("1"), tUrl = W("zero");
  const url = S.params.url || "zero-to-shielded.vercel.app";

  const halo = S.el("div", { class: "e0-halo", style: { width: "900px", height: "900px" } });
  place(halo, 960, 236);
  S.enter(halo, { at: 0.05, dur: 1.2, ease: "outCubic", from: { opacity: 0, scale: 0.5 } });
  const sh = Z.shield(S, { size: 128, x: 960, y: 236 });
  S.enter(sh, { at: 0.12, dur: 1.0, ease: "outBack", from: { opacity: 0, scale: 0.4, rotate: -14 } });
  glint(S, sh, 0.9, { dur: 0.8, id: "end1" });
  Z.burst(S, { at: 0.3, x: 960, y: 236, count: 50, power: 0.7, seed: 12, life: 1.2 });

  const kick = S.el("div", { class: "e0-kicker", text: "Zero to Shielded" });
  place(kick, 960, 352);
  S.enter(kick, { at: 0.25, dur: 0.9, from: { opacity: 0, y: 16, blur: 8 } });

  const head = line(S, S.root, { y: 452, cls: "is-md" });
  say(S, head, "Start with episode 1", 0, { gold: ["1"] });

  const row = seriesRow(S, { x: 960, y: 588 });
  row.dots.forEach((d, i) => S.enter(d, { at: tOne - 0.3 + i * 0.05, dur: 0.7, ease: "outExpo", from: { opacity: 0, y: 26, blur: 8 } }));
  row.links.forEach((l, i) => S.enter(l.parentNode, { at: tOne - 0.25 + i * 0.05, dur: 0.7, ease: "outExpo", from: { opacity: 0, y: 26 } }));
  row.light(0, tOne + 0.05);
  // the first dot keeps calling: a gentle ring every 1.3 s
  [tOne + 1.3, tOne + 2.6, tOne + 3.9].forEach((at) => S.tween(row.dots[0].children[1], { at, dur: 0.9, ease: "outCubic", from: { opacity: 0.8, scale: 1 }, to: { opacity: 0, scale: 1.6 } }));

  const pill = S.el("div", { class: "e0-url", html: `${Z.icons.globe}<span></span><u></u><em></em>` });
  pill.children[1].textContent = url;
  place(pill, 960, 742);
  S.enter(pill, { at: tUrl - 0.1, dur: 1.0, ease: "outExpo", from: { opacity: 0, y: 40, scale: 0.94, blur: 10 } });
  S.tween(pill.querySelector("u"), { at: tUrl + 0.5, dur: 1.1, ease: "outExpo", from: { "--draw": 0 }, to: { "--draw": 1 } });
  const shine = pill.querySelector("em");
  S.tween(shine, { at: W("app") - 0.2, dur: 0.9, ease: "inOutCubic", from: { x: -200 }, to: { x: 980 } });

  // Maya and Sam cheer on either side
  const figs = [
    { ...figure(S, maya, { size: 440, pose: "cheer", mood: "happy" }, { x: 262, y: 650 }), t0: 0.35, ph: 0 },
    { ...figure(S, sam, { size: 440, pose: "cheer", mood: "happy" }, { x: 1658, y: 650 }), t0: 0.5, ph: 0.31 },
  ];
  figs.forEach((f, i) => S.enter(f.el, { at: 0.08 + i * 0.12, dur: 0.9, ease: "outExpo", from: { opacity: 0, y: 260, blur: 12 } }));
  const hop = 0.56;
  S.on((t) => {
    for (const f of figs) {
      const tt = t - f.t0;
      let y = 0, sy = 1;
      // three hops, then a happy sway; each hop is a parabola with a squash on landing
      if (tt > 0 && tt < 3 * hop) {
        const p = (tt % hop) / hop;
        y = -4 * 30 * p * (1 - p);
        sy = 1 - 0.06 * Math.max(0, 1 - p * 6) - 0.06 * Math.max(0, p * 6 - 5);
      } else if (tt >= 3 * hop) {
        y = -6 * Math.sin((tt - 3 * hop) * 2.4) ** 2;
      }
      setTf(f.P["cast-body"], `translate(0px,${y.toFixed(2)}px) scale(${(2 - sy).toFixed(4)},${sy.toFixed(4)})`);
      const sw = Math.sin((t + f.ph) * 7.2);

    }
